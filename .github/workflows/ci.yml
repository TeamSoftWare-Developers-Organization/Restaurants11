name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Checks (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./restaurantsApi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: restaurantsApi/requirements.txt

      - name: Install dependencies
        working-directory: ./restaurantsApi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax & Django check
        working-directory: ./restaurantsApi
        run: |
          python manage.py check

  frontend-ci:
    name: Frontend Build & Typecheck (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./restaurant-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: restaurant-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
