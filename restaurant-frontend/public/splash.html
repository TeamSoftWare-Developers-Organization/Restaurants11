<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RestoSystem - جاري التشغيل | TechTwo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #0f172a 0%, #070b14 70%);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(30, 41, 59, 0.9);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="badge">TechTwo • RestoSystem</div>
  <div class="spinner"></div>
  <h1>RestoSystem - نظام رستو تك لإدارة المطاعم</h1>
  <p>تطوير فريق TechTwo (تك تو) • جاري تشغيل خدمات النظام وقواعد البيانات...</p>
</body>
</html>
