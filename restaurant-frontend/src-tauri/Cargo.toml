[package]
name = "restosystem-pos"
version = "1.0.0"
description = "RestoSystem - Standalone Desktop Restaurant Management & POS Suite by TechTwo"
authors = ["TechTwo Team"]
edition = "2021"

[lib]
name = "smart_restaurant_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
